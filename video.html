
<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What We Were – Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        height: 100vh;
        background-color: black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: white;
        position: relative;
      }

      .cover {
        position: absolute;
        inset: 0;
        background-image: url('video_cover.jpg');
        background-size: cover;
        background-position: center;
        z-index: 0;
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1;
      }

      .content {
        position: relative;
        z-index: 2;
        padding: 20px;
      }

      h1 {
        font-size: 2em;
        margin-bottom: 0.5em;
      }

      button {
        padding: 14px 28px;
        margin: 20px 0;
        background-color: #fff;
        color: #000;
        border: none;
        border-radius: 30px;
        font-weight: 600;
        font-size: 1em;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      button:hover {
        background-color: #ccc;
      }

      .video-container {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 3;
      }

      .video-container iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .links a {
        display: inline-block;
        padding: 12px 24px;
        margin: 5px;
        background-color: #fff;
        color: #000;
        text-decoration: none;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.95em;
        transition: all 0.3s ease;
      }

      .links a:hover {
        background-color: #ccc;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 1.5em;
        }
        button, .links a {
          font-size: 0.9em;
          padding: 12px 20px;
        }
      }
    </style>
    <script>
      function playVideo() {
        document.querySelector('.cover').style.display = 'none';
        document.querySelector('.overlay').style.display = 'none';
        document.querySelector('.content').style.display = 'none';
        const container = document.querySelector('.video-container');
        container.style.display = 'block';
        container.innerHTML = '<iframe src="https://player.vimeo.com/video/956175039?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>';
      }
    </script>
  </head>
  <body>
    <div class="cover"></div>
    <div class="overlay"></div>
    <div class="content">
      <h1>What We Were</h1>
      <button onclick="playVideo()">Guarda il VideoClip</button>
      <div class="links">
        <a href="https://github.com/fotografando/what-we-were/raw/main/Per_Quello_Che_Siamo_Stati.pdf" target="_blank">Scarica il libro in PDF</a>
        <a href="https://we.tl/t-F8VhWQsE2N" target="_blank">Scarica il Video</a>
      </div>
    </div>
    <div class="video-container"></div>
  </body>
</html>
