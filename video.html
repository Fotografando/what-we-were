
<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guarda il Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Montserrat', sans-serif;
        height: 100vh;
        background-color: black;
        overflow: hidden;
      }
      .cover {
        position: absolute;
        inset: 0;
        background-image: url('video_cover.jpg');
        background-size: cover;
        background-position: center;
        z-index: 0;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 1;
      }
      .content {
        position: relative;
        z-index: 2;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        padding: 20px;
      }
      button {
        padding: 14px 28px;
        background-color: #fff;
        color: #000;
        border: none;
        border-radius: 30px;
        font-weight: 600;
        font-size: 1em;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      button:hover {
        background-color: #ccc;
      }
      .video-container {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 3;
      }
      .video-container iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
    <script>
      function playVideo() {
        document.querySelector('.cover').style.display = 'none';
        document.querySelector('.overlay').style.display = 'none';
        document.querySelector('.content').style.display = 'none';
        const container = document.querySelector('.video-container');
        container.style.display = 'block';
        container.innerHTML = '<iframe src="https://www.youtube.com/embed/7P51CxOfKGs?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
      }
    </script>
  </head>
  <body>
    <div class="cover"></div>
    <div class="overlay"></div>
    <div class="content">
      <button onclick="playVideo()">Guarda il Video</button>
    </div>
    <div class="video-container"></div>
  </body>
</html>
